<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D197" />
      <stop offset="50%" stop-color="#C7A45A" />
      <stop offset="100%" stop-color="#9E7B34" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183857" />
      <stop offset="100%" stop-color="#081421" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="url(#navyGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- Crest Geometry -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Monogram SH -->
  <text x="32" y="39" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="24" 
        font-weight="700" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        letter-spacing="1">SH</text>
  
  <!-- Tiny Star on top -->
  <polygon points="32,15 33.5,18 37,18.5 34.5,20.8 35.2,24 32,22.2 28.8,24 29.5,20.8 27,18.5 30.5,18" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
